# Wace config file via .yml
# Version 1.1.3
# You can use ${} to pass an enviroment varible from .env file
# Eg:
# something: ${DATA}

bot:
  # You can add more than 1 token to clone the bot 
  # Note that performance will be dreaded and you can't set each config for each cloned bot
  # Config data of each bot will be the same
  TOKEN: ["BOT_TOKEN"]
  EMBED_COLOR: "#393a41"
  OWNER_ID: "YOUR_USER_ID"
  ADMIN: ["YOUR_TRUSTED_ADMIN"]
  # You can set it to en, fr, de, hi, ko, ru, es and tu. More will come soon.
  LANGUAGE: "en"
  DEBUG_MODE: false
  # Bot branding
  BOT_NAME: "Wace"
  INVITE_LINK: "https://discord.gg/ReA5JyJCR6"
  SOURCE_CODE_LINK: "https://discord.gg/m5Y3rRPuFT"
  SUPPORT_LINK: "https://discord.gg/ReA5JyJCR6"
  # Bot presence/status configuration
  # status: online, idle, dnd, invisible
  # activity_type: 0 = Playing, 1 = Streaming, 2 = Listening, 3 = Watching, 4 = Custom, 5 = Competing
  # activity_name can be a single string or a list for rotating status (changes every 5 seconds)
  PRESENCE:
    status: "online"
    activity_name:
      - "v${version} | /play"
      - "/help | wace bot"
    activity_type: 2

player:
  # Your Last.fm API key and Shared Secret, get them from https://www.last.fm/api/account/create
  # If you don't have or don't want, you can disable it
  LASTFM:
    # Your Last.fm API key and Shared Secret, get them from https://www.last.fm/api/account/create
    # If you don't have or don't want, you can disable it
    enable: false
    api_key: ""
    shared_secret: ""
    callback_url: "http://localhost:3001/api/lastfm/callback"


  SPOTIFY:
    # Your Spotify ID and Secret, you can get it from here: https://developer.spotify.com
    # If you don't have or don't want, you can disable it
    enable: false
    id: ""
    secret: ""

  GENIUS:
    # Your Genius API key, get it from https://genius.com/developers
    enable: false
    api_key: ""

  # Default search suggestion for auto complete, leave it empty will use default
  AUTOCOMPLETE_SEARCH: ["yorushika", "yoasobi", "tuyu", "hinkik"]

  # Enable this if you want to use realtime duation in nowplaying command
  NP_REALTIME: false

  # The number of leave time you want
  LEAVE_TIMEOUT: 60000

  # Must not over 1000 or bot crash
  DEFAULT_VOLUME: 100

  # Basically just uses Soundcloud instead of Youtube.
  AVOID_SUSPEND: true

  # The number of tracks you want to limit
  LIMIT_TRACK: 50

  # The number of playlist you want to limit
  LIMIT_PLAYLIST: 20

  # You can add more Lavalink servers!
  NODES:
    - host: "IP"
      port: 2333 # Your host port here
      name: "Name" #only a-z A-Z 0-9 and _
      auth: "Password"
      secure: false
      driver: "lavalink/v4/koinu"

utilities:
  # Enable debug tools for execute code from bot
  # use dokdo package, owner only, no prefix changes
  # You have to enable message_content to use
  # use: sudo rdc help, for more command
  DEBUG_TOOLS: true
  # Log register premium activities
  PREMIUM_LOG_CHANNEL: ""
  # Log all the guild that bot joined or leaved
  GUILD_LOG_CHANNEL: ""
  # Log all unhandled, error, warnings on discord
  LOG_CHANNEL: ""
  # The timeout for deleting msg
  DELETE_MSG_TIMEOUT: 3000
  # Auto resume when bot restarted suddenly
  AUTO_RESUME: false
  # Set your dashboard controller URL here, leave blank to disable link
  DASHBOARD_URL: "https://localhost:3001"

  # Database services config
  # Note: If you enter an invalid driver, bot will use json driver as default
  # Available drivers: json, mysql, mongodb, postgres
  # Cache cleaning reduces memory usage over time.
  # Uses node-cron syntax: https://github.com/node-cron/node-cron?tab=readme-ov-file#allowed-fields
  # Set cacheCleanSchedule to "DISABLE" to turn off caching entirely.

  # --- JSON (default, no setup required) ---
  DATABASE:
    driver: "json"
    config:
      path: "./wace.database.json"
    cacheCleanSchedule: "0 */30 * * * *"

  # --- MySQL ---
  # DATABASE:
  #   driver: "mysql"
  #   config:
  #     host: "localhost"
  #     user: "wace_user"
  #     password: "Waceuser@2026!"
  #     database: "wace_database"
  #   cacheCleanSchedule: "0 */30 * * * *"

  # --- MongoDB ---
  # DATABASE:
  #   driver: "mongodb"
  #   config:
  #     uri: "mongodb://127.0.0.1:27017/wace"
  #   cacheCleanSchedule: "0 */30 * * * *"

  # --- PostgreSQL ---
  # DATABASE:
  #   driver: "postgres"
  #   config:
  #     host: "localhost"
  #     user: "your_user"
  #     password: "your_password"
  #     database: "your_db_name"
  #   cacheCleanSchedule: "0 */30 * * * *"

  # Msg content for bot using prefix command and setup
  MESSAGE_CONTENT:
    enable: true
    # Whenever you want to use prefix command or not
    commands:
      enable: false
      prefix: "w!" # The prefix you want

  # Fix the Lavalink server when the current is down
  AUTOFIX_LAVALINK:
    enable: false
    retryCount: 10
    retryTimeout: 3000

  GUILD_JOIN_MESSAGE:
    enable: false
    dm_owner: false

  # Weekly database backup (every Sunday at midnight)
  # backup_dir: folder to store backups (relative or absolute path)
  # keep_backups: how many weekly backups to retain before pruning older ones
  DATABASE_BACKUP:
    enable: true
    backup_dir: "./backups"
    keep_backups: 4

  # Guild management: auto-leave rules
  GUILD_MANAGEMENT:
    # Leave guilds with fewer members than the threshold
    LEAVE_SMALL_GUILDS:
      enable: false
      min_members: 15
    # Leave guilds where the bot hasn't been used within the threshold period
    # Duration format: Xd (days), Xm (months), Xyr (years), Xw (weeks), Xh (hours)
    # Examples: 30d, 1m, 1yr, 2w
    LEAVE_INACTIVE_GUILDS:
      enable: false
      inactive_threshold: "30d"

  # WS/REST server for using web player
  WEB_SERVER:
    enable: true
    host: "0.0.0.0"
    port: 3001
    whitelist: [] # Example: ["lavalink.dev"]
    auth: "youshallnotpass"
    EASTER_EGG_REFERENCE: "nostep"

