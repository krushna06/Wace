prefix_length: "`⚠️` | Префикс не может быть длиннее **10 символов**!"

### SongNoti command!
songnoti_set: "`🔔` | Уведомления о песнях установлены на **%{toggle}**!"
songnoti_already: "`⚠️` | Уведомления о песнях уже **%{mode}**!"

### 24/7 command!
247_on: "`✅` | Режим 24/7 теперь **включен**!"
247_off: "`❌` | Режим 24/7 теперь **выключен**!"
247_already: "`⚠️` | Режим 24/7 уже **%{mode}**!"

