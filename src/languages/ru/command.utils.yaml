### Language command!
lang_set: "`📙` | Язык установлен на **%{language}**!"
lang_change: "`📙` | Язык изменен на **%{language}**!"
lang_perm: "`⚠️` | У вас нет разрешения использовать эту команду!"
provide_lang: "`⚠️` | Недействительный язык. Пожалуйста, используйте:\n`%{languages}`"

### Shutdown command!
restart_msg: "`🔌` | **Выключение**..."

### Prefix command!
prefix_set: "`㊙️` | Префикс установлен на **%{prefix}**"
prefix_change: "`㊙️` | Префикс изменен на **%{prefix}**"
