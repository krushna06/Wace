### Language command!
lang_set: "`📙` | Die Sprache wurde auf **%{language}** eingestellt!"
lang_change: "`📙` | Die Sprache wurde zu **%{language}** geändert!"
lang_perm: "`⚠️` | Du hast keine Berechtigung, diesen Befehl zu verwenden!"
provide_lang: "`⚠️` | Ungültige Sprache. Bitte verwende:\n`%{languages}`"

### Shutdown command!
restart_msg: "`🔌` | **Herunterfahren**..."

### Prefix command!
prefix_set: "`㊙️` | Das Präfix wurde auf **%{prefix}** gesetzt!"
prefix_change: "`㊙️` | Das Präfix wurde zu **%{prefix}** geändert!"
prefix_arg: "`⚠️` | Bitte gib ein gültiges Präfix an!"
prefix_length: "`⚠️` | Das Präfix darf nicht länger als **10 Zeichen** sein!"

### SongNoti command!
songnoti_set: "`🔔` | Benachrichtigungen für Songs wurden auf **%{toggle}** gesetzt!"
songnoti_already: "`⚠️` | Benachrichtigungen für Songs sind bereits **%{mode}**!"

### 24/7 command!
247_on: "`✅` | 24/7 Modus ist jetzt **aktiviert**!"
247_off: "`❌` | 24/7 Modus ist jetzt **deaktiviert**!"
247_already: "`⚠️` | 24/7 Modus ist bereits **%{mode}**!"

