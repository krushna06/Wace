autoplay_already: "`⚠️` | Autoplay ist bereits **%{mode}**!"

### ClearQueue command!
clearqueue_msg: "`🗑️` | Die Warteschlange wurde **gelöscht**!"

### Forward command!
forward_msg: "`⏩` | Vorgespult auf `%{duration}`"
