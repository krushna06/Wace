### Language command!
lang_set: "`📙` | 언어가 **%{language}**(으)로 설정되었습니다!"
lang_change: "`📙` | 언어가 **%{language}**(으)로 변경되었습니다!"
lang_perm: "`⚠️` | 이 명령어를 사용할 권한이 없습니다!"
provide_lang: "`⚠️` | 유효하지 않은 언어입니다. 다음 중 하나를 사용해주세요:\n`%{languages}`"

### Shutdown command!
restart_msg: "`🔌` | **종료 중**..."

### Prefix command!
prefix_set: "`㊙️` | 접두사가 **%{prefix}**로 설정되었습니다"
prefix_change: "`㊙️` | 접두사가 **%{prefix}**로 변경되었습니다"
prefix_arg: "`⚠️` | 유효한 접두사를 입력해주세요!"
prefix_length: "`⚠️` | 접두사는 **10자**를 넘을 수 없습니다!"

### SongNoti command!
songnoti_set: "`🔔` | 노래 알림이 **%{toggle}**로 설정되었습니다!"
songnoti_already: "`⚠️` | 이미 노래 알림이 **%{mode}**입니다!"

### 24/7 command!
247_on: "`✅` | 24/7 모드가 **활성화**되었습니다!"
247_off: "`❌` | 24/7 모드가 **비활성화**되었습니다!"
247_already: "`⚠️` | 24/7 모드가 이미 **%{mode}**입니다!"

### Setup command!
setup_msg: "**`⚙️` | 음악 시스템 생성됨** %{channel}\n```참고: 음악 시스템이 제대로 작동하려면 저에 의해 전송된 모든 메시지를 삭제하지 마세요!```"
setup_deleted: "**`⚙️` | 음악 시스템 삭제됨!**"
setup_topic: "⏹ **정지**\n⏮️ **이전**\n⏯ **일시 정지/재개**\n⏭️ **건너뛰기**\n🔁 **반복/반복 해제**"
setup_enable: "`⚠️` | 이미 음악 시스템이 존재합니다!"
setup_null: "`⚠️` | 음악 시스템을 찾을 수 없습니다!"
