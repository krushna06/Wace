### All filter command!
filter_on: "`✅` | %{name} 필터가 이제 **활성화**되었습니다!"
filter_already: "`⚠️` | %{name} 필터는 이미 **활성화**되어 있습니다!"
filter_number: "`⚠️` | 유효한 숫자를 입력해주세요!"
filter_greater: "`⚠️` | 숫자는 **0**보다 커야 합니다!"
filter_less: "`⚠️` | 숫자는 **10**보다 작아야 합니다!"

### Bassboost command!
bassboost_set: "`🎚️` | 베이스 부스트가 **%{amount}dB**로 설정되었습니다!"
bassboost_limit: "`⚠️` | **-10**부터 **10** 사이의 숫자를 사용해주세요!"

### Equalizer command!
eq_author: "이퀄라이저"
eq_icon: "https://i.pinimg.com/originals/cb/17/b8/cb17b80a942d7c317a35ff1324fae12f.gif"
eq_desc: "`🎚️` | **14개 밴드**를 **-10**부터 **10**까지 설정할 수 있습니다. 모든 밴드를 설정할 필요는 없습니다!"
eq_field_title: "예시:"
eq_field_value: "%{prefix}eq 2 3 0 8 0 5 0 -5 0 0"
eq_footer: "이퀄라이저 리셋 • %{prefix}eq reset"
eq_on: "`🎚️` | 이퀄라이저가 **%{bands}**로 설정되었습니다!"
eq_number: "`⚠️` | 유효한 숫자를 입력해주세요!"
eq_greater: "`⚠️` | 숫자는 **-10**보다 커야 합니다!"
eq_less: "`⚠️` | 숫자는 **10**보다 작아야 합니다!"

### Pitch command!
pitch_on: "`🎚️` | 피치가 **%{amount}**으로 설정되었습니다!"

### Rate command!
rate_on: "`🎚️` | 재생 속도가 **%{amount}배**로 설정되었습니다!"

### Speed command!
speed_on: "`🎚️` | 재생 속도가 **%{amount}배**로 설정되었습니다!"

### Reset command!
reset_on: "`❌` | 필터가 **리셋**되었습니다!"
reset_already: "`⚠️` | 필터는 이미 **리셋**되었습니다!"
