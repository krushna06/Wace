### All filter command!
filter_on: "`✅` | Der %{name}-Filter ist jetzt **aktiviert**!"
filter_already: "`⚠️` | Der %{name}-Filter ist bereits **aktiviert**!"
filter_number: "`⚠️` | Bitte gib eine gültige Zahl an!"
filter_greater: "`⚠️` | Die Zahl muss größer als **0** sein!"
filter_less: "`⚠️` | Die Zahl muss kleiner als **10** sein!"

### Bassboost command!
bassboost_set: "`🎚️` | Der Bassboost wurde auf **%{amount}dB** gesetzt!"
bassboost_limit: "`⚠️` | Bitte verwende eine Zahl zwischen **-10** und **10**!"

### Equalizer command!
eq_author: "Equalizer"
eq_icon: "https://i.pinimg.com/originals/cb/17/b8/cb17b80a942d7c317a35ff1324fae12f.gif"
eq_desc: "`🎚️` | Es gibt **14 Bänder**, die von **-10** bis **10** eingestellt werden können. Es ist nicht zwingend erforderlich, alle zu setzen!"
eq_field_title: "Beispiel:"
eq_field_value: "%{prefix}eq 2 3 0 8 0 5 0 -5 0 0"
eq_footer: "Equalizer zurücksetzen • %{prefix}eq reset"
eq_on: "`🎚️` | Der Equalizer wurde auf **%{bands}** gesetzt!"
eq_number: "`⚠️` | Bitte gib eine gültige Zahl an!"
eq_greater: "`⚠️` | Die Zahl muss größer als **-10** sein!"
eq_than: "`⚠️` | Die Zahl muss kleiner als **10** sein!"

### Pitch command!
pitch_on: "`🎚️` | Die Tonhöhe wurde auf **%{amount}** gesetzt!"

### Rate command!
rate_on: "`🎚️` | Die Geschwindigkeit wurde auf **%{amount}x** gesetzt!"

### Speed command!
speed_on: "`🎚️` | Die Geschwindigkeit wurde auf **%{amount}x** gesetzt!"

### Reset command!
reset_on: "`❌` | Der Filter wurde **zurückgesetzt**!"
reset_already: "`⚠️` | Der Filter wurde bereits **zurückgesetzt**!"
